name: Windows build and regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build .\ProperAppUpdater.csproj -c Release
      - name: Regression checks
        run: dotnet run --project .\Tests\ProperAppUpdater.Tests.csproj -c Release
